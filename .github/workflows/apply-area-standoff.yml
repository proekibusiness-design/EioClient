name: Apply stable Area Miner standoff

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 0.26.1 Area Miner and apply only requested safety changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=cca8dfc616da24e34dfefb7d6871a5cd6d059d06
          git checkout "$BASE" -- \
            eio26/EioClient.java \
            eio26/com/eio/client/AreaRegion.java \
            src/test/java/com/eio/client/AreaRegionTest.java \
            gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('eio26/EioClient.java')
          s = p.read_text()
          s = replace_once(s, 'public static final String VERSION = "0.26.1";', 'public static final String VERSION = "0.26.3";', 'version')
          s = replace_once(s, 'public static final String BUILD_ID = "EIO-0261-MINEFIX1";', 'public static final String BUILD_ID = "EIO-0263-STANDOFF5";', 'build id')
          s = replace_once(
              s,
              'mod("Area Miner", "Mining", "Serpentine tunnel miner: clears the next lane cell straight ahead, moves into it, turns at the boundary, shifts one cell and works back across the selected zone.", -1)',
              'mod("Area Miner", "Mining", "Stable serpentine miner: clears the next lane column but keeps a two-block standoff from the newest cleared blocks and never mines deeper than five blocks.", -1)',
              'area description')
          s = replace_once(
              s,
              '.num("Depth", 8.0, 1.0, 64.0, 1.0, "Vertical depth included in the selected zone. Area Miner only targets the current serpentine lane column instead of mining surrounding blocks.")',
              '.num("Depth", 5.0, 1.0, 5.0, 1.0, "Maximum vertical depth. Area Miner is hard-capped to five blocks and only targets the current serpentine lane column.")',
              'area depth setting')
          s = replace_once(
              s,
              '        if (!outside && distance < 0.72) {\n            areaNavIndex++;\n            areaMoveTicks = 0;\n            return false;\n        }',
              '        // Never walk into the newest cleared lane cell. Advance the lane cursor as soon as\n        // the player reaches the two-block standoff, so the miner keeps working ahead of the player.\n        if (!outside && distance <= 2.0) {\n            areaNavIndex++;\n            areaMoveTicks = 0;\n            return false;\n        }',
              'two-block lane completion')
          s = replace_once(
              s,
              '        faceHorizontal(mc.player, goalX, goalZ);\n        return distance > 0.45;',
              '        faceHorizontal(mc.player, goalX, goalZ);\n        return outside ? distance > 0.45 : distance > 2.0;',
              'two-block movement stop')
          p.write_text(s)

          p = Path('eio26/com/eio/client/AreaRegion.java')
          s = p.read_text()
          s = replace_once(s, 'int safeDepth = Math.max(1, Math.min(64, depth));', 'int safeDepth = Math.max(1, Math.min(5, depth));', 'hard five-block depth cap')
          p.write_text(s)

          p = Path('src/test/java/com/eio/client/AreaRegionTest.java')
          s = p.read_text()
          s = replace_once(s, 'assertEquals(65, r.bottomY);', 'assertEquals(66, r.bottomY);', 'test bottom')
          s = replace_once(s, 'assertEquals(6, r.depth());', 'assertEquals(5, r.depth());', 'test depth')
          insert = '''\n    @Test\n    void hardCapsAreaMiningDepthAtFiveBlocks() {\n        AreaRegion r = AreaRegion.from(new BlockPos(0, 80, 0), new BlockPos(1, 78, 1), 64);\n        assertNotNull(r);\n        assertEquals(80, r.topY);\n        assertEquals(76, r.bottomY);\n        assertEquals(5, r.depth());\n        assertFalse(r.contains(new BlockPos(0, 75, 0)));\n    }\n'''
          s = replace_once(s, '\n    @Test\n    void containsOnlyConfiguredVolume()', insert + '\n    @Test\n    void containsOnlyConfiguredVolume()', 'depth cap test insertion')
          p.write_text(s)

          p = Path('gradle.properties')
          s = p.read_text()
          s = replace_once(s, 'mod_version=0.26.1+26.3', 'mod_version=0.26.3+26.3', 'gradle mod version')
          p.write_text(s)

          main = Path('eio26/EioClient.java').read_text()
          region = Path('eio26/com/eio/client/AreaRegion.java').read_text()
          assert 'VERSION = "0.26.3"' in main
          assert 'BUILD_ID = "EIO-0263-STANDOFF5"' in main
          assert 'distance <= 2.0' in main
          assert 'outside ? distance > 0.45 : distance > 2.0' in main
          assert 'Math.min(5, depth)' in region
          assert 'areaLayerIndex' not in main
          print('Stable 0.26.1 miner restored with only standoff/depth safety changes.')
          PY

      - name: Commit stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eio26/EioClient.java eio26/com/eio/client/AreaRegion.java src/test/java/com/eio/client/AreaRegionTest.java gradle.properties
          git diff --cached --check
          git commit -m "Restore stable Area Miner with 2-block standoff and 5-block cap"
          git push origin HEAD:main
