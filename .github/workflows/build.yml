name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'eio26/EioClient.java'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply Eio 0.17 upgrade
        run: python3 .github/eio017_patch.py

      - name: Static source QA
        shell: bash
        run: |
          set -euo pipefail
          SRC=eio26/EioClient.java
          grep -Fq 'VERSION = "0.17.0"' "$SRC"
          grep -Fq 'BUILD_ID = "EIO-017-QA1"' "$SRC"
          grep -Fq 'mod_version=0.17.0+26.3' gradle.properties
          for token in \
            'FOLLOW_MOB_IDS' 'MobListSetting' 'mobList("Mob Selection"' \
            'validFollowTarget' 'nearestFollowTarget' 'getDescriptionId' \
            'mobfilter.' 'MOB FILTER' 'MOB_PAGE_SIZE' 'setAll(true)' 'setAll(false)' \
            'Math.min(690' 'Math.min(390' 'CATEGORIES' 'drawRainbowBlockBrand'; do
            grep -Fq "$token" "$SRC"
          done
          test "$(grep -c '^[[:space:]]*mod("' "$SRC")" -eq 33
          if grep -Eq 'TODO|FIXME' "$SRC"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('eio26/EioClient.java').read_text()
          assert s.count('class MobListSetting') == 1
          assert s.count('public static final class ClickGui') == 1
          assert s.count('private static boolean runFollow') == 1
          assert len(re.findall(r'^[ \t]*mod\("', s, re.M)) == 33
          assert 'GUI=690x390' in s
          print('0.17 static QA passed')
          PY

      - name: Native Java and Fabric build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.17.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$MobListSetting.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$MobListSetting' > /tmp/filter.javap
          for token in validFollowTarget nearestFollowTarget snapshotProperties applyProperties; do grep -Fq "$token" /tmp/main.javap; done
          for token in renderMobSelector handleMobSelectorClick 690 390; do grep -Fq "$token" /tmp/gui.javap; done
          for token in disabledCsv loadDisabledCsv setAll allows; do grep -Fq "$token" /tmp/filter.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-017-QA1' 'Mob Selection' 'entity.minecraft.cow' 'entity.minecraft.zombie' 'mobfilter.'; do grep -Fq "$token" /tmp/main.strings; done
          SIZE=$(stat -c%s "$JAR")
          test "$SIZE" -gt 30000
          echo "Deep QA passed: $JAR"
          echo "SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing 0.17 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize EioClient 0.17 modern Follow release'
            git push origin HEAD:main
          fi

      - name: Upload 0.17 candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.17.0-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
