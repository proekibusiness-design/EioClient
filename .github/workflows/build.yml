name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'eio26/EioClient.java'
      - 'gradle.properties'
      - 'src/main/resources/assets/eioclient/lang/en_us.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply Eio 0.16 advanced quality upgrade
        shell: bash
