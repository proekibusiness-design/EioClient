name: Build EioClient 0.27.1

on:
  push:
    branches: [ compat/0.24-server-authority ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static source and model QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          assert 'VERSION = "0.27.1"' in s
          assert 'BUILD_ID = "EIO-0271-LOS1"' in s
          assert 'mod_version=0.27.1+26.3' in gp
          assert '.num("Layer Height", 4.0, 1.0, 10.0, 1.0' in s
          for token in ['areaVisibleAimPoint','clearAreaRay','faceAreaBlock','categoriesScroll','mouseScrolled','isWithinBlockInteractionRange','Area Miner']:
              assert token in s, token
          assert 'faceAreaBlock(mc, areaMineTarget)' in s
          assert 'return areaVisibleAimPoint(mc, pos) != null;' in s
          print('0.27.1 final static QA passed')
          PY

      - name: Unit tests and Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.27.1+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          for token in findAreaMineTarget areaVisibleAimPoint clearAreaRay faceAreaBlock areaLayerCount updateAreaNavigation; do grep -Fq "$token" /tmp/main.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-0271-LOS1' 'Layer Height' 'Area Miner'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final 0.27.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.27.1-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
