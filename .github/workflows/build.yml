name: Build EioClient 0.26 AREA3

on:
  push:
    branches: [ feature/0.25-area-miner-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply AREA3 fast-turn patch
        run: python3 .github/eio026_area3_patch.py

      - name: Static Area Miner QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          region=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          tests=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.26.0"' in s
          assert 'BUILD_ID = "EIO-026-AREA3"' in s
          assert len(mods)==45
          assert ('Area Miner','Mining') in mods
          for token in ['Turn Lead','Turn Timeout','region.isRowEnd(areaNavIndex)','Fast handoff','return true;']:
              assert token in s, token
          assert 'boolean isRowEnd(int index)' in region
          assert 'identifiesSerpentineRowEndsForFastTurns' in tests
          assert 'categoriesScroll' in s and 'GUI=760x430 modern-nav-glass' in s
          print('AREA3 static QA passed')
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.26.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/AreaRegion.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/region.javap
          for token in findAreaMineTarget updateAreaNavigation areaStatus; do grep -Fq "$token" /tmp/main.javap; done
          grep -Fq 'isRowEnd' /tmp/region.javap
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-026-AREA3' 'Turn Lead' 'Turn Timeout'; do grep -Fq "$token" /tmp/main.strings; done
          echo "AREA3 SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize AREA3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java eio26/com/eio/client/AreaRegion.java src/test/java/com/eio/client/AreaRegionTest.java
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize 0.26 AREA3 fast-turn Area Miner'
            git push origin HEAD:feature/0.25-area-miner-ui
          fi

      - name: Upload AREA3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.26.0-AREA3-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
