name: Build EioClient 0.28 Area Miner Ground Fix

on:
  push:
    branches: [ feature/0.25-area-miner-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply Area Miner ground fix
        run: python3 .github/eio028_groundfix.py

      - name: Static Area Miner regression QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('eio26/EioClient.java').read_text()
          r=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          t=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.28.0"' in s
          assert 'BUILD_ID = "EIO-028-GROUND1"' in s
          assert 'mod_version=0.28.0+26.3' in gp
          assert len(mods)==45, len(mods)
          assert ('Area Miner','Mining') in mods
          assert 'AREA_STAGE_HEIGHT = 5' in s
          assert 'mc.gameMode.continueDestroyBlock(areaMineTarget, hit.getDirection())' in s
          assert 'block directly under your feet' in s
          assert 'int top = Math.max(a.getY(), b.getY()) - 1;' in r
          assert 'cornerStandingPositionStartsMiningAtBlockUnderFeet' in t
          assert 'assertEquals(69, r.topY);' in t
          assert 'categoriesScroll' in s and 'GUI=760x430 modern-nav-glass' in s
          print('0.28 Area Miner ground regression QA passed')
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.28.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/AreaRegion.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/region.javap
          grep -Fq 'continueDestroyBlock' /tmp/main.javap
          for token in findAreaMineTarget updateAreaNavigation areaStatus pauseAreaMiner validAreaMineTarget; do grep -Fq "$token" /tmp/main.javap; done
          for token in stageCount stageTopY stageBottomY navigationCell; do grep -Fq "$token" /tmp/region.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-028-GROUND1' 'NEXT 5-BLOCK LAYER' 'PATH BLOCKED AT LANE'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Candidate 0.28 SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing 0.28 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java eio26/com/eio/client/AreaRegion.java src/test/java/com/eio/client/AreaRegionTest.java gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize 0.28 Area Miner ground fix'
            git push origin HEAD:feature/0.25-area-miner-ui
          fi

      - name: Upload 0.28 candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.28.0-groundfix
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
