name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static source and project QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.22.0"' in s
          assert 'BUILD_ID = "EIO-022-QA1"' in s
          assert 'mod_version=0.22.0+26.3' in gp
          assert len(mods)==42
          assert [x for x in mods if x[0]=='Speed'] == [('Speed','Movement')]
          assert '.num("Multiplier", 1.8, 1.0, 5.0, 0.1' in s
          assert '.bool("Ground Only", true' in s
          assert '.bool("Show HUD", true' in s
          for token in ['applyMovementSpeed','setDeltaMovement','chunkMineRearmTicks','chunkMineAimTicks','CHUNK_MINE_SKIPPED','Retarget Delay','Aim Timeout']:
              assert token in s, token
          chunk_block=s[s.index('        boolean miningAllowed = miningToolSafe(mc);'):s.index('        boolean clickAllowed = !clicker.bool("Require Attack").value')]
          assert 'hit.getBlockPos().equals(chunkMineTarget)' in chunk_block
          assert 'mc.level.getBlockState(chunkMineTarget).isAir()' in chunk_block
          assert 'CHUNK_MINE_SKIPPED.add' in chunk_block
          assert 'chunkMineRearmTicks--' in chunk_block
          assert 'Test Profile' not in s
          assert 'public boolean mouseScrolled(' in s
          assert 'TODO' not in s and 'FIXME' not in s
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          assert 'key.eioclient.speed' in lang and 'key.eioclient.chunk_miner' in lang
          print('0.22 final static QA passed')
          PY

      - name: Native Java and Fabric build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.22.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          [[ "$META" == *'"fabricloader": ">=0.19.5"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in applyMovementSpeed validChunkMineTarget findChunkMineTarget miningToolSafe faceBlock; do grep -Fq "$token" /tmp/main.javap; done
          for token in mouseScrolled settingsContentHeight drawScrollBar; do grep -Fq "$token" /tmp/gui.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-022-QA1' 'Multiplier' 'Ground Only' 'Show HUD' 'Retarget Delay' 'Aim Timeout' 'Chunk Miner'; do grep -Fq "$token" /tmp/main.strings; done
          ! grep -Fq 'Test Profile' /tmp/main.strings
          test "$(stat -c%s "$JAR")" -gt 45000
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.22.0-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
