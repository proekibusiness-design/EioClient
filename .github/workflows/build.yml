name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'eio26/EioClient.java'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply QA2 safe HUD fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('eio26/EioClient.java')
          s = p.read_text()
          old_id = 'public static final String BUILD_ID = "EIO-016-QA1";'
          new_id = 'public static final String BUILD_ID = "EIO-016-QA2";'
          if old_id not in s:
              raise SystemExit('build id target missing')
          s = s.replace(old_id, new_id, 1)
          pattern = r'    private static void guardedHud\(GuiGraphicsExtractor g, DeltaTracker dt\) \{.*?\n    \}\n\n    private static void enterSafeMode'
          replacement = (
              '    private static void guardedHud(GuiGraphicsExtractor g, DeltaTracker dt) {\n'
              '        Minecraft mc = Minecraft.getInstance();\n'
              '        if (runtimeSafeMode) {\n'
              '            if (mc.player != null) {\n'
              '                g.fill(3, 3, 183, 27, 0xD0181210);\n'
              '                g.text(mc.font, "Eio Safe Mode", 8, 7, 0xFFFFA071, true);\n'
              '                g.text(mc.font, "/eio recover after fixing the module", 8, 17, 0xFFD9E0E6, false);\n'
              '            }\n'
              '            return;\n'
              '        }\n'
              '        try {\n'
              '            hud(g, dt);\n'
              '        } catch (Throwable t) {\n'
              '            enterSafeMode("hud", t, mc);\n'
              '        }\n'
              '    }\n\n'
              '    private static void enterSafeMode'
          )
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'guardedHud patch matches={count}')
          p.write_text(s)
          PY

      - name: Static QA2 checks
        shell: bash
        run: |
          set -euo pipefail
          SRC=eio26/EioClient.java
          grep -Fq 'VERSION = "0.16.0"' "$SRC"
          grep -Fq 'BUILD_ID = "EIO-016-QA2"' "$SRC"
          grep -Fq 'Eio Safe Mode' "$SRC"
          grep -Fq '/eio recover after fixing the module' "$SRC"
          grep -Fq 'runtimeSafeMode' "$SRC"
          grep -Fq 'guardedTick' "$SRC"
          grep -Fq 'guardedHud' "$SRC"
          grep -Fq 'literal("selftest")' "$SRC"
          grep -Fq 'literal("profile")' "$SRC"
          grep -Fq 'CPS' "$SRC"
          grep -Fq 'Keystrokes' "$SRC"
          grep -Fq 'Held Item' "$SRC"
          grep -Fq 'mod_version=0.16.0+26.3' gradle.properties
          test "$(grep -c '^[[:space:]]*mod("' "$SRC")" -eq 33
          if grep -Eq 'TODO|FIXME' "$SRC"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^"]+)",\s*"([^"]+)"',s,re.M)
          assert len(mods)==33
          assert len({n.lower() for n,_ in mods})==33
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          for name,_ in mods:
              slug=re.sub(r'(^_+|_+$)','',re.sub(r'[^a-z0-9]+','_',name.lower()))
              assert 'key.eioclient.'+slug in lang
          assert s.count('ClientTickEvents.END_CLIENT_TICK.register(EioClient::guardedTick)')==1
          assert s.count('HudElementRegistry.addLast(Identifier.fromNamespaceAndPath("eioclient", "hud"), EioClient::guardedHud)')==1
          print('QA2 static model checks passed')
          PY

      - name: Build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.16.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          for token in guardedTick guardedHud enterSafeMode selfTestSummary saveProfile loadProfile deleteProfile currentCps; do grep -Fq "$token" /tmp/main.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-016-QA2' 'Eio Safe Mode' '/eio recover after fixing the module' 'selftest' 'profile' 'CPS' 'Keystrokes' 'Held Item'; do grep -Fq "$token" /tmp/main.strings; done
          echo "QA2 JAR SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cmp -s /tmp/eio-first.jar "$SECOND"
          echo "QA2 reproducible SHA256: $(sha256sum "$SECOND" | awk '{print $1}')"

      - name: Canonicalize QA2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java
          if ! git diff --cached --quiet; then
            git commit -m 'Harden EioClient 0.16 safe-mode HUD fallback'
            git push origin HEAD:main
          fi

      - name: Upload QA2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.16.0-QA2-candidate
          path: build/libs/*.jar
          if-no-files-found: error
