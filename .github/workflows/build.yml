name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'eio26/EioClient.java'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply Eio 0.19 GUI upgrade
        run: python3 .github/eio019_patch.py

      - name: Static source QA
        shell: bash
        run: |
          set -euo pipefail
          SRC=eio26/EioClient.java
          grep -Fq 'VERSION = "0.19.0"' "$SRC"
          grep -Fq 'BUILD_ID = "EIO-019-QA1"' "$SRC"
          grep -Fq 'mod_version=0.19.0+26.3' gradle.properties
          for token in \
            'settingsScroll' 'modulesScroll' 'mouseScrolled(double mouseX, double mouseY, double scrollX, double scrollY)' \
            'settingsContentHeight' 'clampScroll' 'drawScrollBar' 'MOB_SELECTOR_HEIGHT' \
            'renderMobSelector' 'handleMobSelectorClick' 'scrollable-glass' \
            '0x72090E14' '0x2E10171F' '0x2410171F' '0x2A10171F' \
            'Mob Selection' 'FOLLOW_MOB_IDS' 'Creative Assist' 'mod("Reach", "Combat"'; do
            grep -Fq "$token" "$SRC"
          done
          test "$(grep -c '^[[:space:]]*mod("' "$SRC")" -eq 35
          if grep -Eq 'TODO|FIXME' "$SRC"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^"]+)",\s*"([^"]+)"',s,re.M)
          assert len(mods)==35
          assert len({n.lower() for n,_ in mods})==35
          assert s.count('public static final class ClickGui')==1
          assert s.count('public boolean mouseScrolled(')==1
          assert s.count('private static void drawScrollBar(')==1
          assert s.count('private int settingsContentHeight(')==1
          assert s.count('class MobListSetting')==1
          assert 'MOB_SELECTOR_HEIGHT = 130' in s
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          for name,_ in mods:
              slug=re.sub(r'(^_+|_+$)','',re.sub(r'[^a-z0-9]+','_',name.lower()))
              assert 'key.eioclient.'+slug in lang, name
          print('0.19 scrollable glass static QA passed')
          PY

      - name: Native Java and Fabric build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.19.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$MobListSetting.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in mouseScrolled settingsContentHeight clampScroll drawScrollBar renderMobSelector handleMobSelectorClick; do grep -Fq "$token" /tmp/gui.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-019-QA1' 'Mob Selection' 'Creative Assist' 'Reach' 'scrollable-glass'; do grep -Fq "$token" /tmp/main.strings; done
          test "$(stat -c%s "$JAR")" -gt 35000
          echo "0.19 candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing 0.19 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize EioClient 0.19 transparent scrollable GUI'
            git push origin HEAD:main
          fi

      - name: Upload 0.19 candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.19.0-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
