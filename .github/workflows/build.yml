name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Eio Client 26.3
        shell: bash
        run: |
          unzip -q eioclient-legit-0.3.0.zip -d extracted
          cd extracted/eioclient
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          fabric_api_version=0.163.0+26.3
          loom_version=1.17.21
          mod_version=0.8.2+26.3
          maven_group=com.eio
          archives_base_name=EioClient-26.3
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": inputs.properties.version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
          EOF
          python3 - <<'PY'
          import json
          p='src/main/resources/fabric.mod.json'
          d=json.load(open(p))
          d['version']='${version}'
          d['name']='Eio Client'
          d['description']='Eio Client 26.3 with ClickGUI, configurable modules, HUD, waypoints and QoL utilities'
          d['depends']={'fabricloader':'>=0.19.5','fabric-api':'*','minecraft':'~26.3','java':'>=25'}
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          rm -rf src/main/java/com/eio/client
          mkdir -p src/main/java/com/eio/client
          cp ../../eio26/EioClient.java src/main/java/com/eio/client/EioClient.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/eio/client/EioClient.java')
          s=p.read_text()
          s=s.replace('import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;', 'import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;\nimport net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents;')
          s=s.replace('public static final String VERSION = "0.8.0";', 'public static final String VERSION = "0.8.2";')
          s=s.replace('private static KeyMapping.Category keyCategory;', 'private static KeyMapping.Category keyCategory;\n    private static KeyMapping guiKey;')
          old='        keyCategory = KeyMapping.Category.register(Identifier.fromNamespaceAndPath("eioclient", "general"));\n        for (Mod m : MODS) {\n            m.bind = KeyMappingHelper.registerKeyMapping(new KeyMapping(\n                    "key.eioclient." + slug(m.name), InputConstants.Type.KEYBOARD, m.defaultKey, keyCategory));\n        }\n'
          new='        keyCategory = KeyMapping.Category.register(Identifier.fromNamespaceAndPath("eioclient", "general"));\n        guiKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(\n                "key.eioclient.v082.clickgui", InputConstants.Type.KEYSYM, InputConstants.KEY_RSHIFT, keyCategory));\n        for (Mod m : MODS) {\n            int key = m.defaultKey < 0 ? InputConstants.UNKNOWN.getValue() : m.defaultKey;\n            m.bind = KeyMappingHelper.registerKeyMapping(new KeyMapping(\n                    "key.eioclient.v082." + slug(m.name), InputConstants.Type.KEYSYM, key, keyCategory));\n        }\n'
          assert old in s, 'registration block not found'
          s=s.replace(old,new)
          old='        ScreenEvents.AFTER_INIT.register((client, screen, w, h) -> {\n            if (screen instanceof TitleScreen) {\n                ScreenEvents.afterExtract(screen).register((s, g, mx, my, delta) -> drawBrand(g, s.width));\n            }\n        });\n'
          new='        ScreenEvents.AFTER_INIT.register((client, screen, w, h) -> {\n            if (screen instanceof TitleScreen) {\n                ScreenEvents.afterExtract(screen).register((s, g, mx, my, delta) -> drawBrand(g, s.width));\n            }\n            if (screen instanceof ClickGui) {\n                ScreenKeyboardEvents.beforeKeyPress(screen).register((s, event) -> {\n                    if (guiKey != null && guiKey.matches(event)) s.onClose();\n                });\n            }\n        });\n'
          assert old in s, 'screen block not found'
          s=s.replace(old,new)
          old='        boolean rshift = InputConstants.isKeyDown(InputConstants.KEY_RSHIFT);\n        if (rshift && !guiGlobalPrev && !guiOpen) openGui();\n        guiGlobalPrev = rshift;\n'
          new='        while (guiKey != null && guiKey.consumeClick()) {\n            if (!guiOpen) openGui();\n        }\n'
          assert old in s, 'raw rshift block not found'
          s=s.replace(old,new)
          s=s.replace('            guiLocalPrev = InputConstants.isKeyDown(InputConstants.KEY_RSHIFT);','            guiLocalPrev = false;')
          old='        @Override public void tick() {\n            super.tick();\n            boolean down = InputConstants.isKeyDown(InputConstants.KEY_RSHIFT);\n            if (down && !guiLocalPrev) { onClose(); return; }\n            guiLocalPrev = down;\n        }\n'
          new='        @Override public void tick() {\n            super.tick();\n        }\n'
          assert old in s, 'raw gui tick block not found'
          s=s.replace(old,new)
          s=s.replace('mc.player.swing(InteractionHand.MAIN_HAND);','mc.player.swing(InteractionHand.MAIN_HAND, mc.player.getMainHandItem().getAttackAnimation(), true);')
          p.write_text(s)
          PY
          mkdir -p src/main/resources/assets/eioclient/lang
          cat > src/main/resources/assets/eioclient/lang/en_us.json <<'EOF'
          {
            "key.category.eioclient.general": "Eio Client",
            "key.eioclient.v082.clickgui": "Open Eio ClickGUI",
            "key.eioclient.v082.kill_aura": "Kill Aura",
            "key.eioclient.v082.auto_clicker": "Auto Clicker",
            "key.eioclient.v082.sprint": "Sprint",
            "key.eioclient.v082.autowalk": "Auto Walk",
            "key.eioclient.v082.fly": "Fly",
            "key.eioclient.v082.safewalk": "Safe Walk",
            "key.eioclient.v082.auto_respawn": "Auto Respawn",
            "key.eioclient.v082.inventory_info": "Inventory Info",
            "key.eioclient.v082.durability_hud": "Durability HUD",
            "key.eioclient.v082.coordinates": "Coordinates",
            "key.eioclient.v082.fps": "FPS",
            "key.eioclient.v082.active_modules": "Active Modules",
            "key.eioclient.v082.fullbright": "Fullbright",
            "key.eioclient.v082.chunk_info": "Chunk Info",
            "key.eioclient.v082.waypoints": "Waypoints",
            "key.eioclient.v082.session_info": "Session Info",
            "key.eioclient.v082.notifications": "Notifications"
          }
          EOF
      - name: Build
        working-directory: extracted/eioclient
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.8.2
          path: |
            extracted/eioclient/build/libs/*.jar
            !extracted/eioclient/build/libs/*-sources.jar
          if-no-files-found: error
