name: Build EioClient 0.26.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static source and layer QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('eio26/EioClient.java').read_text()
          region=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          tests=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.26.2"' in s
          assert 'BUILD_ID = "EIO-0262-LAYER5"' in s
          assert 'mod_version=0.26.2+26.3' in gp
          assert len(mods)==45, len(mods)
          assert ('Area Miner','Mining') in mods
          assert 'areaLayerIndex' in s
          assert 'region.layerTopY(areaLayerIndex)' in s
          assert 'region.layerBottomY(areaLayerIndex)' in s
          assert 'region.hasLayer(areaLayerIndex + 1)' in s
          assert 'areaLayerIndex++' in s
          target=s[s.index('private static BlockPos findAreaMineTarget'):s.index('private static boolean updateAreaNavigation')]
          assert 'for (int y = region.topY; y >= region.bottomY; y--)' not in target
          assert 'for (int y = layerTop; y >= layerBottom; y--)' in target
          assert 'static final int LAYER_DEPTH = 5;' in region
          for token in ['layerCount()', 'layerTopY(int layerIndex)', 'layerBottomY(int layerIndex)', 'layerSummary(int layerIndex)']:
              assert token in region, token
          for token in ['splitsDepthIntoFiveBlockTopDownLayers','exactFiveBlockDepthUsesOneLayer','partialFinalLayerDoesNotExceedRequestedDepth']:
              assert token in tests, token
          for token in ['continueAreaDestroy','stopAreaDestroy','startDestroyBlock','continueDestroyBlock','Mine Timeout']:
              assert token in s, token
          assert 'categoriesScroll' in s and 'public boolean mouseScrolled(' in s
          assert 'GUI=760x430 modern-nav-glass' in s
          print('0.26.2 five-block layer static QA passed; modules=', len(mods))
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.26.2+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/region.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in continueAreaDestroy stopAreaDestroy findAreaMineTarget updateAreaNavigation areaLayerIndex; do grep -Fq "$token" /tmp/main.javap; done
          for token in layerCount layerTopY layerBottomY layerSummary; do grep -Fq "$token" /tmp/region.javap; done
          grep -Fq 'iconst_5' /tmp/region.javap
          for token in categoriesScroll mouseScrolled drawScrollBar PointSetting; do grep -Fq "$token" /tmp/gui.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-0262-LAYER5' 'five-block top-down slabs' 'AREA MINER COMPLETE' 'GUI=760x430 modern-nav-glass'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.26.2-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
