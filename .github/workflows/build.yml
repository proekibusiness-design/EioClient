name: EioClient 0.24.1 protocol-order audit

on:
  push:
    branches: [ compat/0.24-protocol-order ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply 0.24 compatibility baseline
        run: python3 .github/eio024_compat_patch.py

      - name: Fix test runtime and Gradle resource configuration
        run: python3 .github/eio024_testfix.py

      - name: Apply combat packet-phase correctness patch
        run: python3 .github/eio0241_packet_phase_patch.py

      - name: Static source and project QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          build=Path('build.gradle').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.24.1"' in s
          assert 'BUILD_ID = "EIO-0241-PROTOCOL1"' in s
          assert 'mod_version=0.24.1+26.3' in gp
          assert len(mods)==44, len(mods)
          assert ('Compatibility Guard','Misc') in mods
          for token in ['isWithinEntityInteractionRange','isWithinBlockInteractionRange','onServerPositionCorrection',
                        'releaseCorrectionSensitiveState','START_CLIENT_TICK','flushPendingAttack','SingleIntentQueue<Entity>',
                        'Line Of Sight','hasLineOfSight']:
              assert token in s, token
          assert s.count('mc.gameMode.attack(mc.player, target);') == 1
          tick=s[s.index('    private static void tick(Minecraft mc)'):s.index('    private static void applyMovementSpeed')]
          assert 'mc.gameMode.attack' not in tick
          assert Path('src/test/java/com/eio/client/CompatibilityStateTest.java').exists()
          assert Path('src/test/java/com/eio/client/SingleIntentQueueTest.java').exists()
          assert Path('eio26/com/eio/client/SingleIntentQueue.java').exists()
          assert 'testRuntimeOnly "org.junit.platform:junit-platform-launcher"' in build
          assert 'configureTests' in build and 'enableClientGameTests = true' in build
          mixin=json.loads(Path('src/main/resources/eioclient.mixins.json').read_text())
          assert 'ClientPacketListenerMixin' in mixin['client']
          gt=Path('src/gametest/java/com/eio/client/gametest/EioClientGameTest.java').read_text()
          assert '"0.24.1".equals(EioClient.VERSION)' in gt
          print('0.24.1 protocol static QA passed')
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Prepare software OpenGL for client GameTest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 mesa-utils xvfb
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          echo $! >/tmp/xvfb.pid
          sleep 2
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B

      - name: Real 26.3 client + integrated-server GameTest
        timeout-minutes: 3
        shell: bash
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 150s gradle runClientGameTest --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.24.1+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          [[ "$META" == *'eioclient.mixins.json'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/CompatibilityState.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/SingleIntentQueue.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/mixin/ClientPacketListenerMixin.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          for token in guardedStartTick flushPendingAttack withinVanillaBlockRange withinVanillaEntityRange hasRequiredAttackLineOfSight; do grep -Fq "$token" /tmp/main.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-0241-PROTOCOL1' 'Compatibility Guard' 'Line Of Sight' 'queuedAttacks' 'coalescedAttacks'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing protocol changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java gradle.properties src/gametest/java/com/eio/client/gametest/EioClientGameTest.java
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize 0.24.1 packet-phase correctness fixes'
            git push origin HEAD:compat/0.24-protocol-order
          fi

      - name: Upload client GameTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-0.24.1-client-gametest-diagnostics
          path: |
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/config/eio-diagnostics.log
            /tmp/xvfb.log
          if-no-files-found: ignore

      - name: Upload protocol candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.24.1-protocol-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
