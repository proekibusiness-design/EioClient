name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/eio021qa2_patch.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static source and project QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          target_decl=re.findall(r'^[ \t]*\.mobList\("Target Selection"',s,re.M)
          follow_decl=re.findall(r'^[ \t]*\.mobList\("Mob Selection"',s,re.M)
          assert 'VERSION = "0.21.0"' in s
          assert 'BUILD_ID = "EIO-021-QA1"' in s
          assert 'mod_version=0.21.0+26.3' in gp
          assert len(mods)==42
          assert len({n.lower() for n,_ in mods})==42
          assert len(target_decl)==6
          assert len(follow_decl)==1
          cats={c for _,c in mods}
          assert cats == {'Combat','Movement','Player','Render','World','Mining','Misc'}, cats
          for name in ['Auto Mine','Tunnel Miner','Chunk Miner','Tool Saver','Mining HUD','Target Lock','Trigger Bot','Combat Sprint']:
              assert any(n==name for n,_ in mods), name
          assert 'Test Profile' not in s
          assert 'ClientCommands.literal("test")' not in s
          assert 'runTestProfile' not in s and 'appendTestLog' not in s and 'TEST_LOG' not in s
          for token in ['findChunkMineTarget','validChunkMineTarget','miningToolSafe','faceBlock','validConfiguredTarget','faceEntity','attackForced','chunkMineTarget']:
              assert token in s, token
          null_block=s[s.index('        if (mc.player == null) {'):s.index('        Mod walk = find("AutoWalk");')]
          for token in ['attackForced','combatTarget = null','chunkMineTarget = null','triggerCooldown = 0','toolSaverWarned = false']:
              assert token in null_block, token
          assert 'mc.options.keyAttack.setDown(false)' in null_block
          assert '"Active", "Combat", "Movement", "Player", "Render", "World", "Mining", "Misc"' in s
          assert 'public boolean mouseScrolled(' in s
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          assert 'key.eioclient.test_profile' not in lang
          for name,_ in mods:
              slug=re.sub(r'(^_+|_+$)','',re.sub(r'[^a-z0-9]+','_',name.lower()))
              assert 'key.eioclient.'+slug in lang, name
          assert 'TODO' not in s and 'FIXME' not in s
          print('0.21 QA2 final static QA passed')
          PY

      - name: Native Java and Fabric build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.21.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          [[ "$META" == *'"fabricloader": ">=0.19.5"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in validModuleTarget nearestTarget validConfiguredTarget faceEntity miningToolSafe validChunkMineTarget findChunkMineTarget faceBlock; do grep -Fq "$token" /tmp/main.javap; done
          for token in categoryMatches mouseScrolled renderMobSelector handleMobSelectorClick settingsContentHeight drawScrollBar; do grep -Fq "$token" /tmp/gui.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-021-QA1' 'Auto Mine' 'Tunnel Miner' 'Chunk Miner' 'Tool Saver' 'Mining HUD' 'Target Lock' 'Trigger Bot' 'Combat Sprint' 'Mining'; do grep -Fq "$token" /tmp/main.strings; done
          ! grep -Fq 'Test Profile' /tmp/main.strings
          test "$(stat -c%s "$JAR")" -gt 40000
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.21.0-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
