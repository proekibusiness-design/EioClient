name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.buildsrc/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Eio Client 0.15.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          unzip -q eioclient-legit-0.3.0.zip -d extracted
          cd extracted/eioclient

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          fabric_api_version=0.163.0+26.3
          loom_version=1.17.21
          mod_version=0.15.0+26.3
          maven_group=com.eio
          archives_base_name=EioClient-26.3
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources { inputs.property "version", project.version }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
          EOF

          python3 -c "import json; p='src/main/resources/fabric.mod.json'; d=json.load(open(p)); d['version']='0.15.0+26.3'; d['name']='Eio Client'; d['description']='Eio Client 26.3 v0.15.0 advanced quality release with compact glass UI, recovery tools, diagnostics, stable inputs and expanded HUD/QoL modules'; d['authors']=['Eio']; d['environment']='client'; d['depends']={'fabricloader':'>=0.19.5','fabric-api':'*','minecraft':'~26.3','java':'>=25'}; open(p,'w').write(json.dumps(d,indent=2)+'\\n')"

          rm -rf src/main/java/com/eio/client
          mkdir -p src/main/java/com/eio/client
          cp ../../eio26/EioClient.java src/main/java/com/eio/client/EioClient.java
          cmp -s ../../eio26/EioClient.java src/main/java/com/eio/client/EioClient.java

          mkdir -p src/main/resources/assets/eioclient/lang
          cat > src/main/resources/assets/eioclient/lang/en_us.json <<'EOF'
          {
            "key.category.eioclient.general": "Eio Client",
            "key.eioclient.clickgui": "Open Eio ClickGUI",
            "key.eioclient.kill_aura": "Kill Aura",
            "key.eioclient.auto_clicker": "Auto Clicker",
            "key.eioclient.sprint": "Sprint",
            "key.eioclient.autowalk": "Auto Walk",
            "key.eioclient.follow": "Follow",
            "key.eioclient.fly": "Fly",
            "key.eioclient.safewalk": "Safe Walk",
            "key.eioclient.auto_jump": "Auto Jump",
            "key.eioclient.auto_swim": "Auto Swim",
            "key.eioclient.auto_respawn": "Auto Respawn",
            "key.eioclient.low_health_alert": "Low Health Alert",
            "key.eioclient.inventory_info": "Inventory Info",
            "key.eioclient.durability_hud": "Durability HUD",
            "key.eioclient.coordinates": "Coordinates",
            "key.eioclient.fps": "FPS",
            "key.eioclient.active_modules": "Active Modules",
            "key.eioclient.target_hud": "Target HUD",
            "key.eioclient.health": "Health",
            "key.eioclient.speed": "Speed",
            "key.eioclient.facing": "Facing",
            "key.eioclient.rotation": "Rotation",
            "key.eioclient.memory": "Memory",
            "key.eioclient.clock": "Clock",
            "key.eioclient.fullbright": "Fullbright",
            "key.eioclient.chunk_info": "Chunk Info",
            "key.eioclient.waypoints": "Waypoints",
            "key.eioclient.test_profile": "Test Profile",
            "key.eioclient.session_info": "Session Info",
            "key.eioclient.session_timer": "Session Timer",
            "key.eioclient.notifications": "Notifications"
          }
          EOF

      - name: Static source QA
        shell: bash
        run: |
          set -euo pipefail
          SRC=eio26/EioClient.java
          test -s "$SRC"
          grep -Fq 'VERSION = "0.15.0"' "$SRC"
          grep -Fq 'BUILD_ID = "EIO-015-QA1"' "$SRC"
          grep -Fq 'MOD_INDEX' "$SRC"
          grep -Fq 'validateModel()' "$SRC"
          grep -Fq 'literal("panic")' "$SRC"
          grep -Fq 'literal("resetsettings")' "$SRC"
          grep -Fq 'literal("reloadconfig")' "$SRC"
          grep -Fq 'forwardForced' "$SRC"
          grep -Fq 'flyForced' "$SRC"
          grep -Fq 'configSource' "$SRC"
          grep -Fq 'Require Attack' "$SRC"
          grep -Fq 'Low Health Alert' "$SRC"
          grep -Fq 'Rotation' "$SRC"
          grep -Fq 'Memory' "$SRC"
          grep -Fq 'Clock' "$SRC"
          grep -Fq 'Math.min(438' "$SRC"
          grep -Fq 'Math.min(254' "$SRC"
          grep -Fq 'drawRainbowBlockBrand' "$SRC"
          test "$(grep -c '^[[:space:]]*mod("' "$SRC")" -eq 30
          if grep -Fq 'getDayTime()' "$SRC"; then echo 'Unverified world-time API found'; exit 1; fi
          if grep -Eq 'key\.eioclient\.v0[0-9]+' "$SRC"; then echo 'Versioned keybind ID found'; exit 1; fi
          if grep -Eq 'TODO|FIXME' "$SRC"; then echo 'Unresolved TODO/FIXME found'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('eio26/EioClient.java').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^"]+)",\s*"([^"]+)"', s, re.M)
          names=[n for n,_ in mods]
          assert len(mods)==30
          assert len(names)==len(set(n.lower() for n in names))
          allowed={'Combat','Movement','Player','Render','World','Testing','Misc'}
          assert all(c in allowed for _,c in mods)
          print('Canonical model QA:', len(mods), 'modules /', len(allowed), 'categories')
          PY
          echo "Canonical source SHA256: $(sha256sum "$SRC" | awk '{print $1}')"

      - name: Build
        working-directory: extracted/eioclient
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find extracted/eioclient/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.15.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          [[ "$META" == *'"fabricloader": ">=0.19.5"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          jar tf "$JAR" | grep -q '^assets/eioclient/lang/en_us.json$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          for token in 438 254 drawRainbowBlockBrand categoryColor; do grep -Fq "$token" /tmp/gui.javap; done
          for token in validateModel releaseRuntimeState restoreFly forwardForced clickAccumulator; do grep -Fq "$token" /tmp/main.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          unzip -p "$JAR" 'com/eio/client/EioClient$ClickGui.class' > /tmp/ClickGui.class
          strings /tmp/EioClient.class > /tmp/main.strings
          strings /tmp/ClickGui.class > /tmp/gui.strings
          for token in 'EIO-015-QA1' 'key.eioclient.clickgui' 'Auto Clicker' 'Kill Aura' 'Follow' 'Auto Swim' 'Low Health Alert' 'Rotation' 'Memory' 'Clock' 'Session Timer' 'panic' 'resetsettings' 'reloadconfig' 'doctor'; do grep -Fq "$token" /tmp/main.strings; done
          grep -Fq 'MADE BY EIO' /tmp/gui.strings
          if grep -Eq 'key\.eioclient\.v0[0-9]+' /tmp/main.strings; then echo 'Old versioned key ID survived compilation'; exit 1; fi
          SIZE=$(stat -c%s "$JAR")
          test "$SIZE" -gt 22000
          echo "Direct-source QA passed: $JAR"
          echo "Size: $SIZE bytes"
          echo "SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.15.0-direct
          path: |
            extracted/eioclient/build/libs/*.jar
            !extracted/eioclient/build/libs/*-sources.jar
          if-no-files-found: error
