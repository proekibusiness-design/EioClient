name: EioClient 0.24 compatibility audit

on:
  push:
    branches: [ compat/0.24-server-authority ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply focused compatibility patch
        run: python3 .github/eio024_compat_patch.py

      - name: Fix test runtime and Gradle resource configuration
        run: python3 .github/eio024_testfix.py

      - name: Static source and project QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          build=Path('build.gradle').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.24.0"' in s
          assert 'BUILD_ID = "EIO-024-COMPAT1"' in s
          assert 'mod_version=0.24.0+26.3' in gp
          assert len(mods)==44, len(mods)
          assert ('Compatibility Guard','Misc') in mods
          assert 'isWithinEntityInteractionRange' in s
          assert 'isWithinBlockInteractionRange' in s
          assert 'onServerPositionCorrection' in s
          assert 'releaseCorrectionSensitiveState' in s
          assert 'getFlyingSpeed()' in s and 'flyPrevSpeed' in s and 'creativeAssistPrevSpeed' in s
          assert 'org.junit.jupiter:junit-jupiter' in build
          assert 'testRuntimeOnly "org.junit.platform:junit-platform-launcher"' in build
          assert 'useJUnitPlatform()' in build
          assert 'def modVersion = project.version' in build
          assert "expand version: project.version" not in build
          assert 'configureTests' in build and 'enableClientGameTests = true' in build
          mixin=json.loads(Path('src/main/resources/eioclient.mixins.json').read_text())
          assert 'ClientPacketListenerMixin' in mixin['client']
          mod=json.loads(Path('src/main/resources/fabric.mod.json').read_text())
          assert mod.get('mixins') == ['eioclient.mixins.json']
          gt=json.loads(Path('src/gametest/resources/fabric.mod.json').read_text())
          assert gt['entrypoints']['fabric-client-gametest'] == ['com.eio.client.gametest.EioClientGameTest']
          assert Path('src/test/java/com/eio/client/CompatibilityStateTest.java').exists()
          assert Path('src/gametest/java/com/eio/client/gametest/EioClientGameTest.java').exists()
          print('0.24 static compatibility QA passed')
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Real 26.3 client + integrated-server GameTest
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a gradle runClientGameTest --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.24.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          [[ "$META" == *'eioclient.mixins.json'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/CompatibilityState.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/mixin/ClientPacketListenerMixin.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.mixin.ClientPacketListenerMixin' > /tmp/mixin.javap
          for token in onServerPositionCorrection releaseCorrectionSensitiveState withinVanillaBlockRange withinVanillaEntityRange applyMovementSpeed; do grep -Fq "$token" /tmp/main.javap; done
          grep -Fq 'onServerPositionCorrection' /tmp/mixin.javap
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-024-COMPAT1' 'Compatibility Guard' 'Vanilla Ranges' 'Pause On Correction' 'SERVER_POSITION'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload client GameTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-client-gametest-diagnostics
          path: |
            build/run/clientGameTest/logs/**
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/config/eio-diagnostics.log
          if-no-files-found: ignore

      - name: Upload compatibility candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.24.0-compat-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
