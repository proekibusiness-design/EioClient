name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Eio Client 26.3
        shell: bash
        run: |
          unzip -q eioclient-legit-0.3.0.zip -d extracted
          cd extracted/eioclient
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          fabric_api_version=0.163.0+26.3
          loom_version=1.17.21
          mod_version=0.7.0+26.3
          maven_group=com.eio
          archives_base_name=EioClient-26.3
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": inputs.properties.version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
          EOF
          python3 - <<'PY'
          import json
          p='src/main/resources/fabric.mod.json'; d=json.load(open(p)); d['version']='${version}'; d['name']='Eio Client'; d['description']='Eio Client 26.3 rebuilt input, ClickGUI, modules and subtle branding'; d['depends']={'fabricloader':'>=0.19.5','fabric-api':'*','minecraft':'~26.3','java':'>=25'}; open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          rm -rf src/main/java/com/eio/client
          mkdir -p src/main/java/com/eio/client
          cp ../../eio26/EioClient.java src/main/java/com/eio/client/EioClient.java
      - name: Build
        working-directory: extracted/eioclient
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.7.0
          path: |
            extracted/eioclient/build/libs/*.jar
            !extracted/eioclient/build/libs/*-sources.jar
          if-no-files-found: error
