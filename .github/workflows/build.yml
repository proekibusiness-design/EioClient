name: EioClient 0.25 modern GUI

on:
  push:
    branches: [ compat/0.24-server-authority ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply 0.25 modern GUI patch
        run: python3 .github/eio025_gui_patch.py

      - name: Static source and GUI QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          build=Path('build.gradle').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.25.0"' in s
          assert 'BUILD_ID = "EIO-025-GUI1"' in s
          assert 'mod_version=0.25.0+26.3' in gp
          assert len(mods)==44, len(mods)
          assert ('Compatibility Guard','Misc') in mods
          for token in ['categoriesScroll','categoryViewport','categoryMax','WHEEL scrolls each panel','GUI=720x410 modern-scroll-glass']:
              assert token in s, token
          assert 'private int panelW() { return Math.max(430, Math.min(720, width - 18)); }' in s
          assert 'private int panelH() { return Math.max(270, Math.min(410, height - 18)); }' in s
          assert s.count('int railX = x + 10, railW = 108;') >= 3
          assert 'public boolean mouseScrolled(' in s
          assert 'drawScrollBar(g, railX + railW - 3' in s
          assert 'isWithinEntityInteractionRange' in s
          assert 'isWithinBlockInteractionRange' in s
          assert 'onServerPositionCorrection' in s
          assert 'testRuntimeOnly "org.junit.platform:junit-platform-launcher"' in build
          mod=json.loads(Path('src/main/resources/fabric.mod.json').read_text())
          assert mod.get('mixins') == ['eioclient.mixins.json']
          print('0.25 static GUI QA passed')
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and GUI bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.25.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient$ClickGui.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/CompatibilityState.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          for token in categoriesScroll mouseScrolled drawScrollBar clampScroll settingsContentHeight; do grep -Fq "$token" /tmp/gui.javap; done
          for token in onServerPositionCorrection withinVanillaBlockRange withinVanillaEntityRange; do grep -Fq "$token" /tmp/main.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-025-GUI1' 'GUI=720x410 modern-scroll-glass' 'Compatibility Guard'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing 0.25 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize EioClient 0.25 modern scrolling GUI'
            git push origin HEAD:compat/0.24-server-authority
          fi

      - name: Upload 0.25 candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.25.0-gui-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
