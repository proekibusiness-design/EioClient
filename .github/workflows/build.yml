name: Build EioClient 0.26.3 Stand-off

on:
  push:
    branches: [ fix/0.26.3-area-standoff ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable Area Miner and apply stand-off
        run: python3 .github/eio0263_restore_standoff.py

      - name: Static source and regression QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('eio26/EioClient.java').read_text()
          region=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          tests=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.26.3"' in s
          assert 'BUILD_ID = "EIO-0263-STANDOFF2"' in s
          assert 'mod_version=0.26.3+26.3' in gp
          assert len(mods)==45, len(mods)
          assert ('Area Miner','Mining') in mods
          assert 'AREA_FRONT_STANDOFF = 2.0' in s
          assert 'distance <= AREA_FRONT_STANDOFF' in s
          assert 'two-block stand-off' in s
          assert 'areaLayerIndex' not in s
          assert 'layerTopY(' not in s and 'layerBottomY(' not in s
          target=s[s.index('private static BlockPos findAreaMineTarget'):s.index('private static boolean updateAreaNavigation')]
          assert 'for (int y = region.topY; y >= region.bottomY; y--)' in target
          assert 'LAYER_DEPTH' not in region
          assert 'splitsDepthIntoFiveBlockTopDownLayers' not in tests
          for token in ['continueAreaDestroy','stopAreaDestroy','startDestroyBlock','continueDestroyBlock','Mine Timeout','areaDestroyStarted','areaMineWorkTicks']:
              assert token in s, token
          assert 'categoriesScroll' in s and 'public boolean mouseScrolled(' in s
          assert 'GUI=760x430 modern-nav-glass' in s
          print('0.26.3 restored Area Miner static QA passed; modules=', len(mods))
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.26.3+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in continueAreaDestroy stopAreaDestroy areaMiningFace findAreaMineTarget updateAreaNavigation; do grep -Fq "$token" /tmp/main.javap; done
          ! grep -Fq 'areaLayerIndex' /tmp/main.javap
          for token in categoriesScroll mouseScrolled drawScrollBar PointSetting; do grep -Fq "$token" /tmp/gui.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-0263-STANDOFF2' 'two-block stand-off' 'Mine Timeout' 'GUI=760x430 modern-nav-glass'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java eio26/com/eio/client/AreaRegion.java src/test/java/com/eio/client/AreaRegionTest.java gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Restore 0.26.1 Area Miner with two-block front stand-off'
            git push origin HEAD:fix/0.26.3-area-standoff
          fi

      - name: Upload candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.26.3-standoff-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
