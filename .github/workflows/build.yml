name: EioClient 0.30 strict Area Miner stage gate

on:
  push:
    branches: [ fix/0.30-area-miner-stage-gate ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply strict five-block stage fix
        run: python3 .github/eio030_stage_fix.py

      - name: Static stage and GUI QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          r=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          t=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.30.0"' in s
          assert 'BUILD_ID = "EIO-030-STAGE1"' in s
          assert 'mod_version=0.30.0+26.3' in gp
          assert len(mods)==45, len(mods)
          assert ('Area Miner','Mining') in mods
          for token in [
              'currentAreaLaneCell','currentAreaLookTarget','advanceAreaPlaneIfReady',
              'areaPlaneHasBlocks','areaStageHasBlocks','areaStageSweeps',
              'containsStage(pos, areaStageIndex)','stageTopY(areaStageIndex)',
              'stageBottomY(areaStageIndex)','categoriesScroll','mouseScrolled'
          ]:
              assert token in s, token
          assert 'ACTIVE 5-BLOCK BAND IS NOT CLEAR' in s
          assert 'BAND CLEAR - DESCENDING TO Y' in s
          assert 'band Y ' in s
          assert 'static final int STAGE_DEPTH = 5;' in r
          assert 'stageBandsAreStrictAndNonOverlapping' in t
          assert 'clearsPlanesTopDownInsideFiveBlockStages' in t
          # No regression to old whole-depth/random area scanner.
          assert 'findAreaMineTarget' not in s
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          assert lang.get('key.eioclient.area_miner') == 'Area Miner'
          print('0.30 strict stage QA passed; modules=',len(mods))
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.30.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/EioClient$ClickGui.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/AreaRegion.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/region.javap
          for token in currentAreaLaneCell currentAreaLookTarget updateAreaNavigation areaPlaneHasBlocks areaStageHasBlocks advanceAreaPlaneIfReady areaStatus resetAreaRuntime; do
            grep -Fq "$token" /tmp/main.javap
          done
          for token in stageTopY stageBottomY stageLayerCount stageLayerY containsStage containsPlane; do
            grep -Fq "$token" /tmp/region.javap
          done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-030-STAGE1' 'Area Miner' 'ACTIVE 5-BLOCK BAND IS NOT CLEAR' 'BAND CLEAR - DESCENDING TO Y' 'GUI=760x430 modern-nav-glass'; do
            grep -Fq "$token" /tmp/main.strings
          done
          echo "Candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing 0.30 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java gradle.properties src/test/java/com/eio/client/AreaRegionTest.java
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize 0.30 strict five-block Area Miner stages'
            git push origin HEAD:fix/0.30-area-miner-stage-gate
          fi

      - name: Upload 0.30 candidate
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.30.0-stage-gate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
