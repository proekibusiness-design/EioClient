name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Eio Client 26.3
        shell: bash
        run: |
          unzip -q eioclient-legit-0.3.0.zip -d extracted
          cd extracted/eioclient
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          fabric_api_version=0.163.0+26.3
          loom_version=1.17.21
          mod_version=0.10.0+26.3
          maven_group=com.eio
          archives_base_name=EioClient-26.3
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": inputs.properties.version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
          EOF
          python3 - <<'PY'
          import json
          p='src/main/resources/fabric.mod.json'
          d=json.load(open(p))
          d['version']='${version}'
          d['name']='Eio Client'
          d['description']='Eio Client 26.3 v0.10.0 with compact ClickGUI, detailed module controls, Follow mode, HUD and private-server test profiles'
          d['depends']={'fabricloader':'>=0.19.5','fabric-api':'*','minecraft':'~26.3','java':'>=25'}
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          rm -rf src/main/java/com/eio/client
          mkdir -p src/main/java/com/eio/client
          cp ../../eio26/EioClient.java src/main/java/com/eio/client/EioClient.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/eio/client/EioClient.java')
          s = p.read_text()

          s = s.replace('public static final String VERSION = "0.9.0";', 'public static final String VERSION = "0.10.0";')
          s = s.replace('key.eioclient.v090.', 'key.eioclient.v0100.')

          old = '''        mod("Auto Clicker", "Combat", "Automatically attacks the entity under your crosshair at a fixed configured rate.", InputConstants.KEY_C)
                .num("CPS", 10.0, 1.0, 20.0, 1.0, "Fixed clicks per second.")
                .num("Range", 4.5, 1.0, 6.0, 0.25, "Maximum distance to the crosshair target.")
                .bool("Players", true, "Allow attacks on players.")
                .bool("Mobs", true, "Allow attacks on non-player living entities.");'''
          new = '''        mod("Auto Clicker", "Combat", "Automatically attacks a valid target near your crosshair at the configured rate.", InputConstants.KEY_C)
                .num("CPS", 10.0, 1.0, 20.0, 1.0, "Attack attempts per second.")
                .num("Range", 4.5, 1.0, 6.0, 0.25, "Maximum distance used when selecting a click target.")
                .num("FOV", 18.0, 5.0, 90.0, 1.0, "Maximum angle from your crosshair used when selecting a target.")
                .bool("Players", true, "Allow attacks on players.")
                .bool("Mobs", true, "Allow attacks on non-player living entities.")
                .bool("Invisible", false, "Allow attacks on invisible living targets.");'''
          if old not in s: raise SystemExit('Auto Clicker definition patch target not found')
          s = s.replace(old, new)

          old = '''        if (clicker.enabled) {
            if (clickCooldown-- <= 0) {
                int cps = Math.max(1, (int) Math.round(clicker.num("CPS").value));
                clickCooldown = Math.max(1, 20 / cps);
                if (mc.hitResult instanceof EntityHitResult hit && validClickTarget(mc, clicker, hit.getEntity())) attack(mc, hit.getEntity());
            }
        } else clickCooldown = 0;'''
          new = '''        if (clicker.enabled) {
            if (clickCooldown-- <= 0) {
                int cps = Math.max(1, (int) Math.round(clicker.num("CPS").value));
                clickCooldown = Math.max(1, (int) Math.round(20.0 / cps));
                Entity clickTarget = null;
                if (mc.hitResult instanceof EntityHitResult hit && validClickTarget(mc, clicker, hit.getEntity())) {
                    clickTarget = hit.getEntity();
                }
                if (clickTarget == null) {
                    clickTarget = nearestTarget(mc, clicker.num("Range").value, clicker.num("FOV").value,
                            clicker.bool("Players").value, clicker.bool("Mobs").value, clicker.bool("Invisible").value);
                }
                if (clickTarget != null) attack(mc, clickTarget);
            }
        } else clickCooldown = 0;'''
          if old not in s: raise SystemExit('Auto Clicker tick patch target not found')
          s = s.replace(old, new)

          old = '''        if (!(target instanceof Player) && !clicker.bool("Mobs").value) return false;
        double r = clicker.num("Range").value;'''
          new = '''        if (!(target instanceof Player) && !clicker.bool("Mobs").value) return false;
        if (target.isInvisible() && !clicker.bool("Invisible").value) return false;
        if (angleFromView(mc.player, target) > clicker.num("FOV").value / 2.0) return false;
        double r = clicker.num("Range").value;'''
          if old not in s: raise SystemExit('Auto Clicker validation patch target not found')
          s = s.replace(old, new)

          s = s.replace('int bw = Math.min(700, width - 24), bh = Math.min(390, height - 24);',
                        'int bw = Math.min(560, width - 24), bh = Math.min(320, height - 24);')
          s = s.replace('int side = 112, cy = y + 45;', 'int side = 90, cy = y + 45;')
          s = s.replace('int lx = x + side + 11, ly = y + 42, lw = 205, ry = ly + 7;',
                        'int lx = x + side + 9, ly = y + 42, lw = 160, ry = ly + 7;')
          s = s.replace('int lx = x + 123, ly = y + 42, ry = ly + 7, lw = 205;',
                        'int lx = x + 99, ly = y + 42, ry = ly + 7, lw = 160;')
          s = s.replace('if (in(e.x(), e.y(), x + 6, cy - 5, 100, 20))',
                        'if (in(e.x(), e.y(), x + 6, cy - 5, 78, 20))')
          s = s.replace('drawBlockBrand(g, x + 11, y + bh - 22, 2, 0xFF7CAFD0);',
                        'drawBlockBrand(g, x + 11, y + bh - 14, 1, 0xFF7CAFD0);')
          s = s.replace('g.fill(0, 0, width, height, 0x35070A0E);', 'g.fill(0, 0, width, height, 0x24070A0E);')
          s = s.replace('g.fill(x, y, x + bw, y + bh, 0xD9121720);', 'g.fill(x, y, x + bw, y + bh, 0xC9121720);')

          old = '''    private static void drawBrand(GuiGraphicsExtractor g, int width) {
        Minecraft mc = Minecraft.getInstance();
        String text = "Made by Eio";
        int x = width - mc.font.width(text) - 7, y = 7;
        long now = System.currentTimeMillis();
        for (int i = 0; i < text.length(); i++) {
            String ch = text.substring(i, i + 1);
            float hue = ((now % 8000L) / 8000f + i * .035f) % 1f;
            int rgb = Color.HSBtoRGB(hue, .32f, 1f);
            g.text(mc.font, ch, x, y, 0xFF000000 | rgb, false);
            x += mc.font.width(ch);
        }
    }'''
          new = '''    private static void drawBrand(GuiGraphicsExtractor g, int width) {
        String text = "MADE BY EIO";
        int scale = 2;
        int pixelWidth = 0;
        for (int i = 0; i < text.length(); i++) pixelWidth += (text.charAt(i) == ' ' ? 2 : 4) * scale;
        ClickGui.drawBlockBrand(g, width - pixelWidth - 8, 8, scale, 0xFF8CCDF2);
    }'''
          if old not in s: raise SystemExit('Main menu brand patch target not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY
          mkdir -p src/main/resources/assets/eioclient/lang
          cat > src/main/resources/assets/eioclient/lang/en_us.json <<'EOF'
          {
            "key.category.eioclient.general": "Eio Client",
            "key.eioclient.v0100.clickgui": "Open Eio ClickGUI",
            "key.eioclient.v0100.kill_aura": "Kill Aura",
            "key.eioclient.v0100.auto_clicker": "Auto Clicker",
            "key.eioclient.v0100.sprint": "Sprint",
            "key.eioclient.v0100.autowalk": "Auto Walk",
            "key.eioclient.v0100.follow": "Follow",
            "key.eioclient.v0100.fly": "Fly",
            "key.eioclient.v0100.safewalk": "Safe Walk",
            "key.eioclient.v0100.auto_jump": "Auto Jump",
            "key.eioclient.v0100.auto_respawn": "Auto Respawn",
            "key.eioclient.v0100.inventory_info": "Inventory Info",
            "key.eioclient.v0100.durability_hud": "Durability HUD",
            "key.eioclient.v0100.coordinates": "Coordinates",
            "key.eioclient.v0100.fps": "FPS",
            "key.eioclient.v0100.active_modules": "Active Modules",
            "key.eioclient.v0100.target_hud": "Target HUD",
            "key.eioclient.v0100.fullbright": "Fullbright",
            "key.eioclient.v0100.chunk_info": "Chunk Info",
            "key.eioclient.v0100.waypoints": "Waypoints",
            "key.eioclient.v0100.test_profile": "Test Profile",
            "key.eioclient.v0100.session_info": "Session Info",
            "key.eioclient.v0100.notifications": "Notifications"
          }
          EOF
      - name: Build
        working-directory: extracted/eioclient
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.10.0
          path: |
            extracted/eioclient/build/libs/*.jar
            !extracted/eioclient/build/libs/*-sources.jar
          if-no-files-found: error
