name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'eio26/EioClient.java'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply QA2 reload hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('eio26/EioClient.java')
          s=p.read_text()
          if 'public static final String BUILD_ID = "EIO-015-QA1";' in s:
              s=s.replace('public static final String BUILD_ID = "EIO-015-QA1";', 'public static final String BUILD_ID = "EIO-015-QA2";', 1)
          elif 'public static final String BUILD_ID = "EIO-015-QA2";' not in s:
              raise SystemExit('unexpected build id')
          start=s.index('    private static void load() {')
          end=s.index('    private static void save() {', start)
          block=s[start:end]
          if 'b.value = b.defaultValue;' not in block:
              lines=block.splitlines()
              out=[]
              in_settings=False
              transformed=False
              for line in lines:
                  if 'for (Setting s : m.settings) {' in line and not transformed:
                      out.append(line)
                      indent=line[:len(line)-len(line.lstrip())]+'    '
                      out.append(indent+'if (s instanceof BoolSetting b) b.value = b.defaultValue;')
                      out.append(indent+'else if (s instanceof NumSetting n) n.set(n.defaultValue);')
                      in_settings=True
                      continue
                  if in_settings and 'String v = p.getProperty("setting." + m.name + "." + s.name); if (v == null) continue;' in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      out.append(indent+'String v = p.getProperty("setting." + m.name + "." + s.name);')
                      out.append(indent+'if (v == null) continue;')
                      continue
                  if in_settings and 'try { if (s instanceof BoolSetting b) b.value = Boolean.parseBoolean(v); if (s instanceof NumSetting n) n.set(Double.parseDouble(v)); } catch (Exception ignored) {}' in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      out.append(indent+'try {')
                      out.append(indent+'    if (s instanceof BoolSetting b) b.value = Boolean.parseBoolean(v);')
                      out.append(indent+'    else if (s instanceof NumSetting n) n.set(Double.parseDouble(v));')
                      out.append(indent+'} catch (Exception ignored) {}')
                      transformed=True
                      in_settings=False
                      continue
                  out.append(line)
              if not transformed:
                  raise SystemExit('reload loop transformation failed')
              newblock='\n'.join(out)+'\n'
              s=s[:start]+newblock+s[end:]
          p.write_text(s)
          PY

      - name: Static project QA
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle
          test -s build.gradle
          test -s gradle.properties
          test -s eio26/EioClient.java
          test -s src/main/resources/fabric.mod.json
          test -s src/main/resources/assets/eioclient/lang/en_us.json
          grep -Fq 'VERSION = "0.15.0"' eio26/EioClient.java
          grep -Fq 'BUILD_ID = "EIO-015-QA2"' eio26/EioClient.java
          grep -Fq 'b.value = b.defaultValue' eio26/EioClient.java
          grep -Fq 'n.set(n.defaultValue)' eio26/EioClient.java
          grep -Fq 'MOD_INDEX' eio26/EioClient.java
          grep -Fq 'validateModel()' eio26/EioClient.java
          grep -Fq 'literal("panic")' eio26/EioClient.java
          grep -Fq 'literal("resetsettings")' eio26/EioClient.java
          grep -Fq 'literal("reloadconfig")' eio26/EioClient.java
          grep -Fq 'forwardForced' eio26/EioClient.java
          grep -Fq 'flyForced' eio26/EioClient.java
          grep -Fq 'Require Attack' eio26/EioClient.java
          grep -Fq 'Low Health Alert' eio26/EioClient.java
          grep -Fq 'Rotation' eio26/EioClient.java
          grep -Fq 'Memory' eio26/EioClient.java
          grep -Fq 'Clock' eio26/EioClient.java
          grep -Fq 'Math.min(438' eio26/EioClient.java
          grep -Fq 'Math.min(254' eio26/EioClient.java
          test "$(grep -c '^[[:space:]]*mod("' eio26/EioClient.java)" -eq 30
          if grep -Fq 'getDayTime()' eio26/EioClient.java; then exit 1; fi
          if grep -Eq 'key\.eioclient\.v0[0-9]+' eio26/EioClient.java; then exit 1; fi
          if grep -Eq 'TODO|FIXME' eio26/EioClient.java; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^"]+)",\s*"([^"]+)"',s,re.M)
          names=[n for n,_ in mods]
          allowed={'Combat','Movement','Player','Render','World','Testing','Misc'}
          assert len(mods)==30
          assert len(names)==len(set(n.lower() for n in names))
          assert all(c in allowed for _,c in mods)
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          expected={'key.eioclient.'+re.sub(r'(^_+|_+$)','',re.sub(r'[^a-z0-9]+','_',n.lower())) for n in names}
          expected.add('key.eioclient.clickgui')
          assert not sorted(expected-set(lang))
          print('QA2 model:',len(mods),'modules /',len(allowed),'categories')
          PY

      - name: Build native project
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.15.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          for token in 438 254 drawRainbowBlockBrand categoryColor; do grep -Fq "$token" /tmp/gui.javap; done
          for token in validateModel releaseRuntimeState restoreFly forwardForced clickAccumulator; do grep -Fq "$token" /tmp/main.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-015-QA2' 'Auto Clicker' 'Low Health Alert' 'Rotation' 'Memory' 'Clock' 'panic' 'resetsettings' 'reloadconfig' 'doctor'; do grep -Fq "$token" /tmp/main.strings; done
          echo "QA2 JAR SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cmp -s /tmp/eio-first.jar "$SECOND"
          echo "Reproducible QA2 SHA256: $(sha256sum "$SECOND" | awk '{print $1}')"

      - name: Canonicalize QA2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Eio CI"
          git config user.email "actions@users.noreply.github.com"
          git add eio26/EioClient.java
          if ! git diff --cached --quiet; then
            git commit -m "Harden EioClient 0.15 config reload"
            git push origin HEAD:main
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.15.0-QA2
          path: build/libs/*.jar
          if-no-files-found: error
