name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/eio016_patch.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static source and project QA
        shell: bash
        run: |
          set -euo pipefail
          SRC=eio26/EioClient.java
          test -s "$SRC"
          test -s build.gradle
          test -s settings.gradle
          test -s gradle.properties
          test -s src/main/resources/fabric.mod.json
          test -s src/main/resources/assets/eioclient/lang/en_us.json

          grep -Fq 'VERSION = "0.16.0"' "$SRC"
          grep -Fq 'BUILD_ID = "EIO-016-QA2"' "$SRC"
          grep -Fq 'mod_version=0.16.0+26.3' gradle.properties
          grep -Fq 'reproducibleFileOrder = true' build.gradle
          grep -Fq 'preserveFileTimestamps = false' build.gradle

          for token in \
            'guardedTick' 'guardedHud' 'runtimeSafeMode' 'enterSafeMode' \
            'appendDiagnostic' 'selfTestSummary' 'snapshotProperties' 'applyProperties' \
            'saveProfile' 'loadProfile' 'deleteProfile' 'profileSummary' 'currentCps' \
            'resetModuleSettings' 'Eio Safe Mode' '/eio recover after fixing the module' \
            'literal("selftest")' 'literal("recover")' 'literal("profile")' \
            'CPS' 'Keystrokes' 'Held Item' 'PROFILE_DIR' 'DIAGNOSTIC_LOG' \
            'Math.min(438' 'Math.min(254' 'drawRainbowBlockBrand'; do
            grep -Fq "$token" "$SRC"
          done

          test "$(grep -c '^[[:space:]]*mod("' "$SRC")" -eq 33
          if grep -Eq 'TODO|FIXME' "$SRC"; then echo 'Unresolved TODO/FIXME found'; exit 1; fi
          if grep -Eq 'key\.eioclient\.v0[0-9]+' "$SRC"; then echo 'Versioned keybind ID found'; exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^"]+)",\s*"([^"]+)"', s, re.M)
          names=[n for n,_ in mods]
          allowed={'Combat','Movement','Player','Render','World','Testing','Misc'}
          assert len(mods)==33, len(mods)
          assert len(names)==len(set(n.lower() for n in names)), 'duplicate module name'
          assert all(c in allowed for _,c in mods), 'invalid category'
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          expected={'key.eioclient.'+re.sub(r'(^_+|_+$)','',re.sub(r'[^a-z0-9]+','_',n.lower())) for n in names}
          expected.add('key.eioclient.clickgui')
          missing=sorted(expected-set(lang))
          assert not missing, f'missing language keys: {missing}'
          assert s.count('ClientTickEvents.END_CLIENT_TICK.register(EioClient::guardedTick)')==1
          assert s.count('HudElementRegistry.addLast(Identifier.fromNamespaceAndPath("eioclient", "hud"), EioClient::guardedHud)')==1
          assert s.count('private static void guardedHud(')==1
          assert 'p.setProperty("_schema", "4")' in s
          print(f'Final model QA: {len(mods)} modules / {len(allowed)} categories / {len(lang)} language entries')
          PY
          echo "Source SHA256: $(sha256sum "$SRC" | awk '{print $1}')"

      - name: Native Java and Fabric build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"

          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.16.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          [[ "$META" == *'"fabricloader": ">=0.19.5"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]

          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          jar tf "$JAR" | grep -q '^assets/eioclient/lang/en_us.json$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"

          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in guardedTick guardedHud enterSafeMode selfTestSummary snapshotProperties applyProperties saveProfile loadProfile deleteProfile profileSummary currentCps resetModuleSettings releaseRuntimeState restoreFly; do
            grep -Fq "$token" /tmp/main.javap
          done
          for token in 438 254 drawRainbowBlockBrand categoryColor; do
            grep -Fq "$token" /tmp/gui.javap
          done

          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in \
            'EIO-016-QA2' 'Eio Safe Mode' '/eio recover after fixing the module' \
            'selftest' 'recover' 'profile' 'CPS' 'Keystrokes' 'Held Item' \
            'eio-diagnostics.log' 'eioclient.properties.bak'; do
            grep -Fq "$token" /tmp/main.strings
          done
          if grep -Eq 'key\.eioclient\.v0[0-9]+' /tmp/main.strings; then echo 'Old versioned key ID survived compilation'; exit 1; fi

          SIZE=$(stat -c%s "$JAR")
          test "$SIZE" -gt 26000
          echo "Deep QA passed: $JAR"
          echo "Size: $SIZE bytes"
          echo "SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.16.0-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
