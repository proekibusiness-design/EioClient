name: Build EioClient 0.28 final

on:
  push:
    branches: [ feature/0.28-area-miner-plane-first ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static planner and GUI QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          r=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          t=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.28.0"' in s
          assert 'BUILD_ID = "EIO-028-PLANE1"' in s
          assert 'mod_version=0.28.0+26.3' in gp
          assert len(mods)==45, len(mods)
          assert ('Area Miner','Mining') in mods
          for token in ['areaLayerIndex','areaStallPasses','areaPlaneHasBlocks','advanceAreaPlaneIfReady','containsPlane','stageLayerCount','stageLayerY','NEXT PLANE Y','categoriesScroll','mouseScrolled']:
              assert token in s or token in r, token
          finder=s[s.index('private static BlockPos findAreaMineTarget'):s.index('private static boolean areaPlaneHasBlocks')]
          assert 'for (int y = region.stageTopY(areaStageIndex)' not in finder
          assert 'int targetY = region.stageLayerY(areaStageIndex, areaLayerIndex);' in finder
          assert 'clearsPlanesTopDownInsideFiveBlockStages' in t
          assert 'static final int STAGE_DEPTH = 5;' in r
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          assert lang.get('key.eioclient.area_miner') == 'Area Miner'
          print('0.28 final static QA passed; modules=',len(mods))
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.28.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/EioClient$ClickGui.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/AreaRegion.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/area.javap
          for token in findAreaMineTarget validAreaMineTarget updateAreaNavigation areaPlaneHasBlocks advanceAreaPlaneIfReady areaStatus resetAreaRuntime; do grep -Fq "$token" /tmp/main.javap; done
          for token in containsPlane stageLayerCount stageLayerY navigationCell; do grep -Fq "$token" /tmp/area.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-028-PLANE1' 'Area Miner' 'NEXT PLANE Y' 'AREA MINER COMPLETE' 'GUI=760x430 modern-nav-glass'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final 0.28 JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.28.0-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
