name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/eio020_patch.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static source and project QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("',s,re.M)
          target_decl=re.findall(r'^[ \t]*\.mobList\("Target Selection"',s,re.M)
          follow_decl=re.findall(r'^[ \t]*\.mobList\("Mob Selection"',s,re.M)
          assert 'VERSION = "0.20.0"' in s
          assert 'BUILD_ID = "EIO-020-QA1"' in s
          assert 'mod_version=0.20.0+26.3' in gp
          assert len(mods)==35
          assert len(target_decl)==3
          assert len(follow_decl)==1
          assert s.count('private static boolean validModuleTarget')==1
          assert s.count('nearestTarget(Minecraft mc, Mod selector')==1
          assert s.count('private boolean categoryMatches')==1
          assert '"Active", "Combat"' in s
          assert 'ACTIVE = enabled modules' in s
          assert 'public boolean mouseScrolled(' in s
          assert 'categoryMatches(m, selectedCategory)' in s
          assert 'return "Active".equals(category) ? m.enabled : m.category.equals(category);' in s
          assert 'TODO' not in s and 'FIXME' not in s
          print('0.20 final static QA passed: modules=',len(mods),'target selectors=',len(target_decl))
          PY

      - name: Native Java and Fabric build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.20.0+26.3"'* ]]
          [[ "$META" == *'"environment": "client"'* ]]
          [[ "$META" == *'"fabricloader": ">=0.19.5"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$MobListSetting.class$'
          jar tf "$JAR" | grep -q '^com/eio/client/EioClient\$ClickGui.class$'
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in validModuleTarget nearestTarget validClickTarget; do grep -Fq "$token" /tmp/main.javap; done
          for token in categoryMatches mouseScrolled renderMobSelector handleMobSelectorClick settingsContentHeight drawScrollBar; do grep -Fq "$token" /tmp/gui.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class > /tmp/EioClient.class
          strings /tmp/EioClient.class > /tmp/main.strings
          for token in 'EIO-020-QA1' 'Target Selection' 'Mob Selection' 'entity.minecraft.cow' 'entity.minecraft.zombie'; do grep -Fq "$token" /tmp/main.strings; done
          unzip -p "$JAR" 'com/eio/client/EioClient$ClickGui.class' > /tmp/ClickGui.class
          strings /tmp/ClickGui.class > /tmp/gui.strings
          grep -Fq 'Active' /tmp/gui.strings
          grep -Fq 'ACTIVE = enabled modules' /tmp/gui.strings
          test "$(stat -c%s "$JAR")" -gt 35000
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.20.0-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
