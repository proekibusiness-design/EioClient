name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Create Eio Client 26.3
        shell: bash
        run: |
          unzip -q eioclient-legit-0.3.0.zip -d extracted
          cd extracted/eioclient
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          fabric_api_version=0.163.0+26.3
          loom_version=1.17.21
          mod_version=0.5.1+26.3
          maven_group=com.eio
          archives_base_name=EioClient-26.3
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": inputs.properties.version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
          EOF
          python3 - <<'PY'
          import json
          p='src/main/resources/fabric.mod.json'; d=json.load(open(p)); d['version']='${version}'; d['name']='Eio Client'; d['description']='Eio Client 26.3 utility client with ClickGUI'; d['depends']={'fabricloader':'>=0.19.5','fabric-api':'*','minecraft':'~26.3','java':'>=25'}; open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          rm -rf src/main/java/com/eio/client && mkdir -p src/main/java/com/eio/client
          cat > src/main/java/com/eio/client/EioClient.java <<'EOF'
          package com.eio.client;
          import com.mojang.blaze3d.platform.InputConstants;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.*;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.minecraft.client.*;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.MouseButtonEvent;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import java.util.*;

          public final class EioClient implements ClientModInitializer {
            public static final String VERSION="0.5.1"; private static final List<Mod> MODS=new ArrayList<>(); private static KeyMapping guiKey;
            static { add("Sprint","Movement","Automatically sprint while moving forward.",true); add("AutoWalk","Movement","Keeps the forward key held for you.",true); add("SafeWalk","Movement","Movement utility profile.",false); add("Step Assist","Movement","Step movement utility profile.",false); add("Coordinates","Render","Shows your XYZ position on the HUD.",true); add("FPS","Render","Shows the current FPS on the HUD.",true); add("Active Modules","Render","Shows enabled modules on the HUD.",true); add("Fullbright","Render","Brightness utility toggle.",false); add("Clean HUD","Render","Minimal Eio HUD presentation.",true); add("Auto Respawn","Player","Player convenience module.",false); add("Inventory Info","Player","Inventory information utility.",false); add("Durability HUD","Player","Equipment durability information.",false); add("Waypoints","World","World navigation utility profile.",false); add("Chunk Info","World","World/chunk information utility.",false); add("Session Info","Misc","Displays session information.",true); add("Notifications","Misc","Module state indicator.",true); }
            private static void add(String n,String c,String d,boolean i){MODS.add(new Mod(n,c,d,i));}
            @Override public void onInitializeClient(){
              KeyMapping.Category cat=KeyMapping.Category.register(Identifier.fromNamespaceAndPath("eioclient","general"));
              guiKey=KeyMappingHelper.registerKeyMapping(new KeyMapping("key.eioclient.clickgui",InputConstants.Type.KEYBOARD,344,cat));
              ClientTickEvents.END_CLIENT_TICK.register(EioClient::tick); HudElementRegistry.addLast(Identifier.fromNamespaceAndPath("eioclient","hud"),EioClient::hud);
              ClientCommandRegistrationCallback.EVENT.register((d,a)->d.register(ClientCommands.literal("eio").executes(c->{open();return 1;}).then(ClientCommands.literal("gui").executes(c->{open();return 1;})).then(ClientCommands.literal("list").executes(c->{c.getSource().sendFeedback(Component.literal(summary()));return 1;})).then(ClientCommands.literal("toggle").then(ClientCommands.argument("module",StringArgumentType.greedyString()).executes(c->{Mod m=find(StringArgumentType.getString(c,"module"));if(m==null){c.getSource().sendFeedback(Component.literal("Unknown module"));return 0;}toggle(m);return 1;})))));
            }
            private static void open(){Minecraft.getInstance().setScreen(new ClickGui());}
            private static void tick(Minecraft mc){if(guiKey!=null)while(guiKey.consumeClick())open();if(mc.player==null)return;Mod w=find("AutoWalk"),s=find("Sprint");if(w.enabled)mc.options.keyUp.setDown(true);if(s.enabled&&mc.options.keyUp.isDown()&&mc.player.getFoodData().getFoodLevel()>6&&!mc.player.horizontalCollision)mc.player.setSprinting(true);}
            private static void hud(GuiGraphicsExtractor g,DeltaTracker dt){Minecraft mc=Minecraft.getInstance();if(mc.player==null)return;int y=5;g.text(mc.font,"Eio Client 26.3",5,y,0xFF7CC8FF,true);y+=11;if(find("Coordinates").enabled){g.text(mc.font,String.format(Locale.ROOT,"XYZ %.1f  %.1f  %.1f",mc.player.getX(),mc.player.getY(),mc.player.getZ()),5,y,0xFFFFFFFF,true);y+=11;}if(find("FPS").enabled){g.text(mc.font,"FPS "+mc.getFps(),5,y,0xFFFFFFFF,true);y+=11;}if(find("Active Modules").enabled)for(Mod m:MODS)if(m.enabled&&!m.name.equals("Active Modules")&&!m.name.equals("Coordinates")&&!m.name.equals("FPS")){g.text(mc.font,m.name,5,y,0xFF9AD8FF,true);y+=10;}}
            private static Mod find(String n){for(Mod m:MODS)if(m.name.equalsIgnoreCase(n))return m;return null;} private static void toggle(Mod m){m.enabled=!m.enabled;if(m.name.equals("AutoWalk")&&!m.enabled)Minecraft.getInstance().options.keyUp.setDown(false);} private static String summary(){StringJoiner j=new StringJoiner(" | ");for(Mod m:MODS)j.add(m.name+":"+(m.enabled?"ON":"OFF"));return j.toString();}
            private static final class Mod{final String name,category,description;final boolean implemented;boolean enabled;Mod(String n,String c,String d,boolean i){name=n;category=c;description=d;implemented=i;}}
            public static final class ClickGui extends Screen{
              private static final String[] CATS={"Movement","Render","Player","World","Misc"};private String selected="Movement";private Mod selectedMod;ClickGui(){super(Component.literal("Eio Client"));}@Override public boolean isPauseScreen(){return false;}
              @Override public void extractRenderState(GuiGraphicsExtractor g,int mx,int my,float delta){g.fill(0,0,width,height,0xC9080B10);int bw=Math.min(720,width-30),bh=Math.min(430,height-30),x=(width-bw)/2,y=(height-bh)/2;g.fill(x,y,x+bw,y+bh,0xF0121720);g.fill(x,y,x+bw,y+34,0xFF171E29);g.fill(x,y,x+4,y+bh,0xFF48A9E6);g.text(font,"EIO",x+16,y+11,0xFF73C9FF,true);g.text(font,"CLIENT 26.3",x+42,y+11,0xFFB8C4D1,true);g.text(font,"Right Shift",x+bw-78,y+11,0xFF6F7C8B,false);int side=120,cy=y+52;g.fill(x,y+34,x+side,y+bh,0xFF0D1118);for(String c:CATS){boolean a=c.equals(selected),h=in(mx,my,x+8,cy-5,side-16,24);if(a||h)g.fill(x+8,cy-5,x+side-8,cy+19,a?0xFF183B52:0xFF151C25);g.text(font,c,x+18,cy+3,a?0xFF73C9FF:0xFFB7C0CA,false);cy+=30;}g.text(font,"Eio v"+VERSION,x+16,y+bh-18,0xFF596675,false);int lx=x+side+14,ly=y+48,lw=220,ry=ly+8;g.text(font,selected.toUpperCase(Locale.ROOT),lx,ly-8,0xFF738292,false);for(Mod m:MODS)if(m.category.equals(selected)){boolean h=in(mx,my,lx,ry,lw,38),ch=m==selectedMod;g.fill(lx,ry,lx+lw,ry+34,ch?0xFF1C3140:(h?0xFF1A222D:0xFF141A22));if(m.enabled)g.fill(lx,ry,lx+3,ry+34,0xFF55C6FF);g.text(font,m.name,lx+10,ry+7,m.enabled?0xFFFFFFFF:0xFFD1D6DC,false);String st=m.enabled?"ON":"OFF";g.text(font,st,lx+lw-font.width(st)-9,ry+7,m.enabled?0xFF66E3A4:0xFF66717E,false);g.text(font,m.implemented?"Ready":"Framework",lx+10,ry+20,m.implemented?0xFF6E8191:0xFF705F78,false);ry+=40;}int dx=lx+lw+18,dw=x+bw-14-dx;g.fill(dx,ly,dx+dw,y+bh-18,0xFF0F141B);if(selectedMod==null){g.text(font,"Select a module",dx+18,ly+18,0xFFDCE4EB,false);g.text(font,"Left click to toggle. Right click for details.",dx+18,ly+38,0xFF71808F,false);}else{g.text(font,selectedMod.name,dx+18,ly+18,0xFFFFFFFF,true);g.text(font,selectedMod.category+" module",dx+18,ly+34,0xFF73C9FF,false);g.text(font,selectedMod.description,dx+18,ly+60,0xFFAEB9C4,false);int by=ly+92;g.fill(dx+18,by,dx+dw-18,by+28,selectedMod.enabled?0xFF176B4B:0xFF26303B);g.centeredText(font,selectedMod.enabled?"ENABLED":"DISABLED",dx+dw/2,by+10,0xFFFFFFFF);g.text(font,selectedMod.implemented?"Status: implemented":"Status: framework ready",dx+18,by+48,selectedMod.implemented?0xFF65D99C:0xFFB792C6,false);}super.extractRenderState(g,mx,my,delta);}
              @Override public boolean mouseClicked(MouseButtonEvent e,boolean doubled){int bw=Math.min(720,width-30),bh=Math.min(430,height-30),x=(width-bw)/2,y=(height-bh)/2,cy=y+52;for(String c:CATS){if(in(e.x(),e.y(),x+8,cy-5,104,24)){selected=c;selectedMod=null;return true;}cy+=30;}int lx=x+134,ry=y+56,lw=220;for(Mod m:MODS)if(m.category.equals(selected)){if(in(e.x(),e.y(),lx,ry,lw,34)){selectedMod=m;if(e.button()==0)toggle(m);return true;}ry+=40;}if(selectedMod!=null){int dx=lx+lw+18,dw=x+bw-14-dx,by=y+140;if(in(e.x(),e.y(),dx+18,by,dw-36,28)){toggle(selectedMod);return true;}}return super.mouseClicked(e,doubled);}private static boolean in(double mx,double my,int x,int y,int w,int h){return mx>=x&&mx<x+w&&my>=y&&my<y+h;}
            }
          }
          EOF
      - name: Build
        working-directory: extracted/eioclient
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-GUI
          path: |
            extracted/eioclient/build/libs/*.jar
            !extracted/eioclient/build/libs/*-sources.jar
          if-no-files-found: error
