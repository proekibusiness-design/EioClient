name: Build EioClient 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Eio Client 26.3
        shell: bash
        run: |
          unzip -q eioclient-legit-0.3.0.zip -d extracted
          cd extracted/eioclient
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          loader_version=0.19.5
          fabric_api_version=0.163.0+26.3
          loom_version=1.17.21
          mod_version=0.9.0+26.3
          maven_group=com.eio
          archives_base_name=EioClient-26.3
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": inputs.properties.version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
          EOF
          python3 - <<'PY'
          import json
          p='src/main/resources/fabric.mod.json'
          d=json.load(open(p))
          d['version']='${version}'
          d['name']='Eio Client'
          d['description']='Eio Client 26.3 v0.9.0 with compact ClickGUI, configurable modules, Follow mode, HUD and anti-cheat test profiles'
          d['depends']={'fabricloader':'>=0.19.5','fabric-api':'*','minecraft':'~26.3','java':'>=25'}
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          rm -rf src/main/java/com/eio/client
          mkdir -p src/main/java/com/eio/client
          cp ../../eio26/EioClient.java src/main/java/com/eio/client/EioClient.java
          mkdir -p src/main/resources/assets/eioclient/lang
          cat > src/main/resources/assets/eioclient/lang/en_us.json <<'EOF'
          {
            "key.category.eioclient.general": "Eio Client",
            "key.eioclient.v090.clickgui": "Open Eio ClickGUI",
            "key.eioclient.v090.kill_aura": "Kill Aura",
            "key.eioclient.v090.auto_clicker": "Auto Clicker",
            "key.eioclient.v090.sprint": "Sprint",
            "key.eioclient.v090.autowalk": "Auto Walk",
            "key.eioclient.v090.follow": "Follow",
            "key.eioclient.v090.fly": "Fly",
            "key.eioclient.v090.safewalk": "Safe Walk",
            "key.eioclient.v090.auto_jump": "Auto Jump",
            "key.eioclient.v090.auto_respawn": "Auto Respawn",
            "key.eioclient.v090.inventory_info": "Inventory Info",
            "key.eioclient.v090.durability_hud": "Durability HUD",
            "key.eioclient.v090.coordinates": "Coordinates",
            "key.eioclient.v090.fps": "FPS",
            "key.eioclient.v090.active_modules": "Active Modules",
            "key.eioclient.v090.target_hud": "Target HUD",
            "key.eioclient.v090.fullbright": "Fullbright",
            "key.eioclient.v090.chunk_info": "Chunk Info",
            "key.eioclient.v090.waypoints": "Waypoints",
            "key.eioclient.v090.test_profile": "Test Profile",
            "key.eioclient.v090.session_info": "Session Info",
            "key.eioclient.v090.notifications": "Notifications"
          }
          EOF
      - name: Build
        working-directory: extracted/eioclient
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.9.0
          path: |
            extracted/eioclient/build/libs/*.jar
            !extracted/eioclient/build/libs/*-sources.jar
          if-no-files-found: error
