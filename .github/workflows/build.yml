name: EioClient 0.26 Area Miner candidate

on:
  push:
    branches: [ compat/0.24-server-authority ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply 0.26 Area Miner and GUI patch
        run: python3 .github/eio026_area_patch.py

      - name: Apply Area Miner compile fix
        run: python3 .github/eio026_fix1.py

      - name: Static source, model and navigation QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('eio26/EioClient.java').read_text()
          gp=Path('gradle.properties').read_text()
          mods=re.findall(r'^[ \t]*mod\("([^\"]+)",\s*"([^\"]+)"',s,re.M)
          assert 'VERSION = "0.26.0"' in s
          assert 'BUILD_ID = "EIO-026-AREA1"' in s
          assert 'mod_version=0.26.0+26.3' in gp
          assert len(mods)==45, len(mods)
          assert ('Area Miner','Mining') in mods
          for token in [
              'PointSetting', 'Corner A', 'Corner B', 'Depth', 'Move Timeout',
              'findAreaMineTarget', 'validAreaMineTarget', 'updateAreaNavigation',
              'areaStatus', 'resetAreaRuntime', 'areaMoveRequested',
              'categoriesScroll', 'NAVIGATION', 'WHEEL panel scroll',
              'GUI=760x430 modern-nav-glass', 'isWithinBlockInteractionRange'
          ]:
              assert token in s, token
          assert 'private int panelW() { return Math.max(450, Math.min(760, width - 16)); }' in s
          assert 'private int panelH() { return Math.max(280, Math.min(430, height - 16)); }' in s
          assert s.count('int railX = x + 10, railW = 122;') >= 3
          assert 'public boolean mouseScrolled(' in s
          assert 'trim(areaStatus(' not in s
          assert Path('eio26/com/eio/client/AreaRegion.java').exists()
          assert Path('src/test/java/com/eio/client/AreaRegionTest.java').exists()
          lang=json.loads(Path('src/main/resources/assets/eioclient/lang/en_us.json').read_text())
          assert lang.get('key.eioclient.area_miner') == 'Area Miner'
          print('0.26 static QA passed; modules=', len(mods))
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR and bytecode QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.26.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          jar tf "$JAR" > /tmp/jar.list
          test -z "$(sort /tmp/jar.list | uniq -d)"
          grep -Fqx 'com/eio/client/EioClient.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/EioClient$ClickGui.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/EioClient$PointSetting.class' /tmp/jar.list
          grep -Fqx 'com/eio/client/AreaRegion.class' /tmp/jar.list
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/area.javap
          for token in findAreaMineTarget validAreaMineTarget updateAreaNavigation areaStatus resetAreaRuntime withinVanillaBlockRange; do grep -Fq "$token" /tmp/main.javap; done
          for token in categoriesScroll mouseScrolled drawScrollBar PointSetting; do grep -Fq "$token" /tmp/gui.javap; done
          for token in navigationCell supportedSize contains; do grep -Fq "$token" /tmp/area.javap; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-026-AREA1' 'Area Miner' 'Corner A' 'Corner B' 'Move Timeout' 'GUI=760x430 modern-nav-glass'; do grep -Fq "$token" /tmp/main.strings; done
          echo "Candidate SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Canonicalize passing 0.26 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add eio26/EioClient.java eio26/com/eio/client/AreaRegion.java gradle.properties src/main/resources/assets/eioclient/lang/en_us.json src/test/java/com/eio/client/AreaRegionTest.java
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize Eio 0.26 Area Miner and modern navigation'
            git push origin HEAD:compat/0.24-server-authority
          fi

      - name: Upload 0.26 candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.26.0-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
