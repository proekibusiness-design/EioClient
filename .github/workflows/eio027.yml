name: EioClient 0.27 layered Area Miner

on:
  push:
    branches: [ fix/0.27-layered-area-miner ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static behavioral QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('eio26/EioClient.java').read_text()
          r=Path('eio26/com/eio/client/AreaRegion.java').read_text()
          t=Path('src/test/java/com/eio/client/AreaRegionTest.java').read_text()
          gp=Path('gradle.properties').read_text()
          assert 'VERSION = "0.27.0"' in s
          assert 'BUILD_ID = "EIO-027-LAYER1"' in s
          assert 'mod_version=0.27.0+26.3' in gp
          assert '.num("Depth", 20.0, 5.0, 64.0, 5.0' in s
          assert 'areaLayerIndex' in s
          assert 'containsInLayer(pos, areaLayerIndex)' in s
          assert 'if (pos.getY() >= region.surfaceY) return false;' in s
          assert 'Only search forward through the CURRENT serpentine lane' in s
          assert 'NEXT 5-BLOCK LAYER' in s
          assert 'surfaceY' in r
          assert 'int mineTop = surface - 1;' in r
          assert 'surface - safeDepth' in r
          assert 'int layerCount() { return (depth() + 4) / 5; }' in r
          assert 'return topY - layer * 5;' in r
          assert 'return Math.max(bottomY, layerTop(layer) - 4);' in r
          assert 'excavatesFiveBlocksAtATimeStrictlyBelowSurface' in t
          assert 'AreaRegion.from(new BlockPos(0, 64, 0), new BlockPos(2, 64, 2), 5)' in t
          assert 'categoriesScroll' in s and 'mouseScrolled' in s
          assert s.count('else if (setting instanceof PointSetting point) point.reset();') == 1
          area = s[s.index('private static AreaRegion areaRegion'):s.index('private static void faceHorizontal')]
          assert 'for (int dy = -radius' not in area
          print('0.27 direct-source static QA passed')
          PY

      - name: Unit tests and native Fabric build
        run: gradle clean test build --stacktrace --warning-mode all

      - name: Deep JAR QA
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR" && test -s "$JAR"
          unzip -tqq "$JAR"
          META=$(unzip -p "$JAR" fabric.mod.json)
          [[ "$META" == *'"version": "0.27.0+26.3"'* ]]
          [[ "$META" == *'"minecraft": "~26.3"'* ]]
          [[ "$META" == *'"java": ">=25"'* ]]
          test -z "$(jar tf "$JAR" | sort | uniq -d)"
          jar tf "$JAR" > /tmp/jarlist
          grep -F 'com/eio/client/AreaRegion.class' /tmp/jarlist >/dev/null
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient' > /tmp/main.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.AreaRegion' > /tmp/area.javap
          javap -classpath "$JAR" -c -p 'com.eio.client.EioClient$ClickGui' > /tmp/gui.javap
          for token in validAreaMineTarget findAreaMineTarget finishOrAdvanceAreaLayer updateAreaNavigation; do grep -F "$token" /tmp/main.javap >/dev/null; done
          for token in layerCount layerTop layerBottom containsInLayer; do grep -F "$token" /tmp/area.javap >/dev/null; done
          for token in mouseScrolled categoriesScroll drawScrollBar; do grep -F "$token" /tmp/gui.javap >/dev/null; done
          unzip -p "$JAR" com/eio/client/EioClient.class | strings > /tmp/main.strings
          for token in 'EIO-027-LAYER1' 'Area Miner' 'NEXT 5-BLOCK LAYER' 'Total excavation depth below the selected surface'; do grep -F "$token" /tmp/main.strings >/dev/null; done
          echo "Final SHA256: $(sha256sum "$JAR" | awk '{print $1}')"

      - name: Byte-for-byte reproducibility
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          cp "$FIRST" /tmp/eio-first.jar
          FIRST_SHA=$(sha256sum /tmp/eio-first.jar | awk '{print $1}')
          gradle clean test build --quiet
          SECOND=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          SECOND_SHA=$(sha256sum "$SECOND" | awk '{print $1}')
          cmp -s /tmp/eio-first.jar "$SECOND"
          test "$FIRST_SHA" = "$SECOND_SHA"
          echo "Reproducible SHA256: $SECOND_SHA"

      - name: Upload final 0.27 JAR
        uses: actions/upload-artifact@v4
        with:
          name: EioClient-26.3-v0.27.0-layered-area-final
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
